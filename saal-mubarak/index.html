<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saal Mubarak · નૂતન વર્ષાભિનંદન ✨</title>
<meta name="description" content="A Saal Mubarak wish for you. Tap the swastik on the new chopda — and create your own New Year wish for family and friends.">
<meta name="theme-color" content="#1c0714">
<meta property="og:type" content="website">
<meta property="og:title" content="✨ સાલ મુબારક! A New Year wish for you">
<meta property="og:description" content="Nutan Varshabhinandan · Vikram Samvat 2083 — tap to open your wish 🙏">
<meta property="og:image" content="https://shrihariji.github.io/Invites/saal-mubarak/assets/og-preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://shrihariji.github.io/Invites/saal-mubarak/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Mukta:wght@400;600;700&family=Mukta+Vaani:wght@400;600;700&family=Rasa:wght@500;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body data-lang="gu">

<canvas id="sky" aria-hidden="true"></canvas>
<div id="fxv" aria-hidden="true">
  <video class="v rk1" src="assets/fx/rocket.mp4" muted playsinline loop preload="metadata"></video>
  <video class="v rk2" src="assets/fx/rocket.mp4" muted playsinline loop preload="metadata"></video>
  <video class="v an1" src="assets/fx/anar.mp4" muted playsinline loop preload="metadata"></video>
  <video class="v an2" src="assets/fx/anar.mp4" muted playsinline loop preload="metadata"></video>
</div>
<canvas id="fx" aria-hidden="true"></canvas>

<button id="mute" class="icon-btn" aria-label="Sound on/off" hidden>🔊</button>
<div class="lang-chips top" role="group" aria-label="Language">
  <button data-l="gu">ગુજ</button><button data-l="hi">हिं</button><button data-l="en">EN</button>
</div>

<!-- HERO: the wish moment -->
<section id="hero">
  <p class="from-top" id="fromTop"></p>

  <div class="stage">
    <svg id="rangoli" viewBox="-200 -200 400 400" aria-hidden="true"></svg>
    <button id="chopda" class="chopda" aria-label="Draw the swastik on the new chopda">
      <span class="glow"></span>
      <svg viewBox="0 0 240 170" aria-hidden="true">
        <defs>
          <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d42a2a"/><stop offset="1" stop-color="#7d0b16"/></linearGradient>
          <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff3d6"/><stop offset=".85" stop-color="#fbe6b8"/><stop offset="1" stop-color="#e9c98a"/></linearGradient>
          <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#fff3d6"/><stop offset=".85" stop-color="#fbe6b8"/><stop offset="1" stop-color="#e9c98a"/></linearGradient>
          <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c76a"/><stop offset=".5" stop-color="#fff0b8"/><stop offset="1" stop-color="#d79a3a"/></linearGradient>
        </defs>
        <ellipse cx="120" cy="160" rx="104" ry="8" fill="#0007"/>
        <path d="M6 22 Q60 10 120 22 Q180 10 234 22 V152 Q180 140 120 154 Q60 140 6 152Z" fill="url(#cover)"/>
        <path d="M6 22 Q60 10 120 22 Q180 10 234 22 V152 Q180 140 120 154 Q60 140 6 152Z" fill="none" stroke="url(#gold)" stroke-width="2.4"/>
        <path d="M16 26 Q70 16 120 30 V146 Q70 134 16 142Z" fill="url(#pageL)"/>
        <path d="M224 26 Q170 16 120 30 V146 Q170 134 224 142Z" fill="url(#pageR)"/>
        <g stroke="#d9433a" stroke-width=".8" opacity=".35" fill="none">
          <path d="M30 34 V136"/><path d="M106 34 V140"/><path d="M134 34 V140"/><path d="M210 34 V136"/>
        </g>
        <path d="M120 30 V146" stroke="#b8894a" stroke-width="1.6"/>
        <g class="sw" transform="translate(66 86)">
          <path class="swp" pathLength="1" d="M0,-30V30M-30,0H30M0,-30H26M30,0V26M0,30H-26M-30,0V-26"/>
          <circle class="dot" cx="-14" cy="-14" r="3.6"/><circle class="dot" cx="14" cy="-14" r="3.6"/>
          <circle class="dot" cx="14" cy="14" r="3.6"/><circle class="dot" cx="-14" cy="14" r="3.6"/>
        </g>
        <g class="sl" font-family="Rasa, serif" font-weight="700" text-anchor="middle" fill="#c4161c">
          <text class="w0" x="174" y="56" font-size="20">॥ શ્રી ॥</text>
          <text class="w1" x="174" y="94" font-size="30">શુભ</text>
          <text class="w2" x="174" y="130" font-size="30">લાભ</text>
        </g>
      </svg>
    </button>
    <span class="tap-hand" aria-hidden="true"><i class="tap-ring"></i><svg viewBox="0 0 48 48"><path d="M20 23V9.5a3 3 0 0 1 6 0V20l8.4 1.7a4.6 4.6 0 0 1 3.6 5.3l-1.3 8a6.5 6.5 0 0 1-6.4 5.5h-8.4a6.5 6.5 0 0 1-5-2.4L10.6 31a3 3 0 0 1 4.4-4.1L20 31z"/></svg></span>
    <p class="tap-hint" id="tapHint"></p>
    <img class="couple" id="couple" src="" data-src="assets/fx/couple.webp" alt="" hidden>
  </div>

  <div class="wish" id="wish" aria-live="polite">
    <p class="samvat" id="samvat"><span id="svLabel"></span> <span class="yr"><span id="yrHead"></span><span class="roll"><span class="col"><i id="yrOld"></i><i id="yrNew"></i></span></span></span></p>
    <h1 class="title" id="t1"></h1>
    <p class="line" id="l1"></p>
    <h2 class="title2" id="t2"></h2>
    <p class="line" id="l2"></p>
    <p class="sign" id="sign"></p>
  </div>

  <div class="diya-row" id="diyaRow" aria-hidden="true"></div>
  <p class="scroll-hint" id="scrollHint">⌄</p>
</section>

<!-- fireworks strip (blends onto the night sky) -->
<div class="fx-strip" aria-hidden="true">
  <video class="v sp" src="assets/fx/sparkler.mp4" muted playsinline loop preload="none"></video>
  <video class="v ck" src="assets/fx/chakri.mp4" muted playsinline loop preload="none"></video>
  <video class="v sp" src="assets/fx/sparkler.mp4" muted playsinline loop preload="none"></video>
</div>

<!-- ACTIONS -->
<section id="actions" class="panel">
  <h3 id="aTitle"></h3>
  <p class="muted" id="aSub"></p>
  <button class="btn gold" id="btnCreate"></button>
  <button class="btn ghosty" id="btnForward"></button>
  <p class="muted tiny" id="tapMore"></p>
</section>

<!-- SAMPLE INVITE (sell it - big and obvious) -->
<section id="sampleCard" class="panel sample-card">
  <p class="sc-badge" id="scBadge"></p>
  <h3 id="scTitle"></h3>
  <a class="sc-shot" href="https://shrihariji.github.io/Invites/sample-wedding/" target="_blank" rel="noopener" aria-label="Open the sample wedding invitation">
    <img src="assets/sample-thumb.jpg" alt="" loading="lazy" width="720" height="378"><span class="sc-play">▶</span>
  </a>
  <ul class="sc-points" id="scPoints"></ul>
  <a class="btn sc-btn" href="https://shrihariji.github.io/Invites/sample-wedding/" target="_blank" rel="noopener" id="scBtn"></a>
</section>

<!-- STUDIO CARD (marketing) -->
<section id="studio" class="panel studio">
  <p class="eyebrow" id="sEyebrow"></p>
  <h3 class="brand">HariKrishna <span>AI Studios</span></h3>
  <p class="tagline" id="sTag"></p>
  <ul class="occasions" id="sOcc"></ul>
  <p class="person">Chaitanya</p>
  <a class="phone" href="tel:+919408877393">94088 77393</a>
  <div class="cta-row">
    <a class="btn wa" id="waStudio" target="_blank" rel="noopener"></a>
    <a class="btn ghosty" href="tel:+919408877393" id="callStudio"></a>
  </div>
  <a class="sample" href="https://shrihariji.github.io/Invites/sample-wedding/" target="_blank" rel="noopener" id="sample"></a>
</section>

<footer>
  <p>© HariKrishna AI Studios · 94088 77393</p>
</footer>

<!-- CREATE SHEET -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="cTitle">
    <button class="icon-btn close" id="sheetClose" aria-label="Close">✕</button>
    <div id="formStep">
      <h3 id="cTitle"></h3>
      <label for="inFrom" id="lbFrom"></label>
      <input id="inFrom" maxlength="48" autocomplete="name">
      <p class="lbl" id="lbLang"></p>
      <div class="lang-chips form" role="group">
        <button data-fl="gu">ગુજરાતી</button><button data-fl="hi">हिंदी</button><button data-fl="en">English</button>
      </div>
      <label for="inMsg" id="lbMsg"></label>
      <textarea id="inMsg" rows="5" maxlength="600"></textarea>
      <p class="hint-small" id="msgHint"></p>
      <p class="err" id="err" hidden></p>
      <button class="btn gold" id="btnMake"></button>
    </div>
    <div id="doneStep" hidden>
      <h3 id="dTitle"></h3>
      <p class="muted" id="dSub"></p>
      <div class="linkbox msgbox" id="linkBox"></div>
      <button class="btn gold" id="btnCopy"></button>
      <a class="btn wa" id="btnWa" target="_blank" rel="noopener"></a>
      <button class="btn ghosty" id="btnCopyLink"></button>
      <button class="btn ghosty" id="btnShare" hidden></button>
      <a class="btn ghosty" id="btnPreview"></a>
      <button class="link-btn" id="btnAgain"></button>
    </div>
  </div>
</div>

<!-- Swipe-up hint (same as the wedding invite) -->
<div id="swipe" aria-hidden="true">
  <div class="sw-arrows"><i></i><i></i><i></i></div>
  <svg class="sw-hand" viewBox="0 0 48 48"><circle class="sw-tap" cx="23" cy="9" r="7"/>
    <path d="M20 23V9.5a3 3 0 0 1 6 0V20l8.4 1.7a4.6 4.6 0 0 1 3.6 5.3l-1.3 8a6.5 6.5 0 0 1-6.4 5.5h-8.4a6.5 6.5 0 0 1-5-2.4L10.6 31a3 3 0 0 1 4.4-4.1L20 31z"/></svg>
  <p id="swipeTxt"></p>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/app.js?v=1"></script>
</body>
</html>
