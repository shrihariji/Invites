<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Radhika &amp; Aaryan - Wedding Invitation</title>
  <meta name="theme-color" content="#f6ecdc">
  <meta name="description" content="Mehendi · Survani · Mandva · Lagna — 30 Dec 2026 to 02 Jan 2027">
  <!-- WhatsApp / social link preview. og:image must be the full public address. -->
  <meta property="og:title" content="You are invited · Radhika &amp; Aaryan">
  <meta property="og:description" content="Mehendi · Survani · Mandva · Lagna — 30 Dec 2026 to 02 Jan 2027. Tap to open.">
  <meta property="og:image" content="https://shrihariji.github.io/Invites/radhika-aaryan/assets/img/og-preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Marcellus+SC&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Pinyon+Script&family=Tiro+Devanagari+Hindi&family=Rasa:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/img/hero.webp">
  <link rel="preload" as="image" href="assets/img/seal.webp">
  <link rel="prefetch" href="assets/img/palms-plain.webp">
  <link rel="prefetch" href="assets/img/palms-mehendi.webp">
  <link rel="preload" as="image" href="assets/img/gate-left.webp">
  <link rel="preload" as="image" href="assets/img/gate-right.webp">
  <link rel="stylesheet" href="css/style.css?v=25">
</head>
<body class="locked" data-opener="gates">
  <div id="lang" role="group" aria-label="Language"><button data-l="en">EN</button><button data-l="gu">ગુજ</button></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- ===== Opening: silk curtains + wax seal ===== -->
  <div id="curtain" class="gates">
    <div class="gate-stage" aria-hidden="true">
      <div class="door door-left"><img src="assets/img/gate-left.webp" alt=""></div>
      <div class="door door-right"><img src="assets/img/gate-right.webp" alt=""></div>
    </div>
    <div class="gate-shade" aria-hidden="true"></div>
    <div class="curtain-ui">
      <div class="c-top">
        <img class="c-om" src="assets/img/om-ganesh.webp" alt="">
        <p class="c-dear"><span data-t="dear"></span> <span data-guest></span>,</p>
        <p class="c-gu">આપને સહ પરિવાર પધારવા<br>ભાવભર્યું નિમંત્રણ</p>
        <p class="c-sub" data-th="cSub"></p>
      </div>
      <button id="seal" aria-label="Tap the seal to open the invitation"><img src="assets/img/seal.webp" alt=""></button>
      <p class="seal-hint"><b data-t="sealHint"></b> <span data-t="soundOn"></span></p>
    </div>
  </div>
  <div id="flash" aria-hidden="true"></div>

  <main id="app">
    <!-- ===== Hero: temple arch (two screens over one painting) ===== -->
    <section class="hero" id="top">
      <div class="stick"><div class="cover"><div class="art"><img src="assets/img/hero.webp" alt=""></div></div></div>
      <div class="hero-page p1">
        <div class="glow">
          <div class="shlokas" id="shlokas"></div>
          <div class="om-wrap"><img class="om" src="assets/img/om-ganesh.webp" alt="Shri Ganesh"></div>
          <h1 class="names">
            <span class="n1" data-field="bride.first"></span>
            <span class="amp">&amp;</span>
            <span class="n2" data-field="groom.first"></span>
          </h1>
          <p class="range" data-field="dateRange"></p>
          <p class="city" data-field="cityLine"></p>
        </div>
      </div>
      <div class="hero-page p2">
        <div class="glow">
          <img class="g-mini reveal" src="assets/img/ganesh-mini.webp" alt="">
          <p class="dear reveal"><span data-t="dear"></span> <span data-guest></span>,</p>
          <div class="invite-lines" id="inviteLines"></div>
          <h2 class="dr reveal" data-field="bride.full"></h2>
          <p class="par reveal" data-field="bride.parents"></p>
          <p class="amp2 reveal">&amp;</p>
          <h2 class="dr reveal" data-field="groom.full"></h2>
          <p class="par reveal" data-field="groom.parents"></p>
        </div>
      </div>
    </section>

    <!-- ===== Save the date: scratch + countdown ===== -->
    <section class="paper save">
      <h2 class="title reveal" data-t="saveTitle"></h2>
      <p class="gu-sub reveal" data-t="saveSub"></p>
      <p class="note reveal" data-t="scratchNote"></p>
      <div class="medal reveal">
        <div class="medal-in">
          <span class="m-day" data-field="dateReveal.day"></span>
          <span class="m-mon"><span data-field="dateReveal.month"></span> · <span data-field="dateReveal.year"></span></span>
          <span class="m-line" data-field="dateReveal.line"></span>
        </div>
        <canvas id="scratch" aria-label="Scratch area"></canvas>
      </div>
      <div class="countdown reveal" id="countdown">
        <div><b data-cd="d">0</b><span data-t="days"></span></div>
        <div><b data-cd="h">0</b><span data-t="hours"></span></div>
        <div><b data-cd="m">0</b><span data-t="mins"></span></div>
        <div><b data-cd="s">0</b><span data-t="secs"></span></div>
      </div>
      <button class="btn ghost reveal" id="calAll" data-t="calAll"></button>
    </section>

    <!-- ===== At a glance ===== -->
    <section class="paper glance">
      <h2 class="title reveal" data-t="celebTitle"></h2>
      <p class="gu-sub reveal" data-t="celebSub"></p>
      <p class="note reveal" data-t="tapDay"></p>
      <ol id="glanceList"></ol>
    </section>

    <!-- ===== Event worlds (built from data.js) ===== -->
    <div id="scenes"></div>

    <!-- ===== Photos ===== -->
    <section class="paper moments">
      <h2 class="title reveal" data-field="photosTitle"></h2>
      <p class="note reveal" data-t="photosNote"></p>
      <div class="reel" id="reel"></div>
      <div class="dots" id="dots"></div>
    </section>

    <!-- ===== Family ===== -->
    <section class="family">
      <div class="cover"><div class="art"><img src="assets/img/hero.webp" alt="" loading="lazy"></div></div>
      <div class="fam-card">
        <div id="famList"></div>
        <p class="fam-group reveal" data-field="familyGroup"></p>
        <img class="logo reveal" id="logo" src="assets/img/saras-logo.webp" alt="Saras Detergent" loading="lazy">
        <p class="bless-only reveal" data-field="blessingsNote"></p>
        <p class="credit"><a id="creditWa" target="_blank" rel="noopener"><span data-t="madeBy"></span> <span data-field="credit.name"></span></a>
          · <a id="creditTel"></a></p>
      </div>
    </section>

    <!-- ===== RSVP (hidden when no WhatsApp number in data.js) ===== -->
    <section class="paper rsvp" id="rsvp" hidden>
      <h2 class="title reveal" data-t="rsvpTitle"></h2>
      <p class="note reveal" id="rsvpBy"></p>
      <form id="rsvpForm" class="reveal" onsubmit="return false">
        <div class="choice">
          <label><input type="radio" name="att" value="yes" checked><span data-t="attYes"></span></label>
          <label><input type="radio" name="att" value="no"><span data-t="attNo"></span></label>
        </div>
        <label class="count"><span data-t="guests"></span>
          <select name="count"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6+</option></select>
        </label>
        <textarea name="msg" rows="3" data-tp="msgPh"></textarea>
        <button class="btn" id="rsvpBtn" type="button" data-t="sendWa"></button>
      </form>
    </section>


  </main>

  <!-- ===== Event details sheet ===== -->
  <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-bg"></div>
    <div class="sheet-card">
      <button class="sheet-x" aria-label="Close">×</button>
      <div id="sheetBody"></div>
    </div>
  </div>

  <!-- ===== Photo viewer ===== -->
  <div id="viewer" hidden><img alt=""><button aria-label="Close">×</button></div>

  <button id="sound" aria-label="Sound off" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2a1 1 0 0 1 1 1v.6a6.5 6.5 0 0 1 5.5 6.4v4.4l1.7 2.6a.6.6 0 0 1-.5.9H4.3a.6.6 0 0 1-.5-.9l1.7-2.6V10a6.5 6.5 0 0 1 5.5-6.4V3a1 1 0 0 1 1-1zm-2.4 17h4.8a2.4 2.4 0 0 1-4.8 0z"/></svg>
  </button>
  <audio id="bgm" loop preload="none"></audio>

  <!-- ===== Swipe-up hint (like Reels) ===== -->
  <div id="swipe" aria-hidden="true">
    <div class="sw-arrows"><i></i><i></i><i></i></div>
    <svg class="sw-hand" viewBox="0 0 48 48"><circle class="sw-tap" cx="23" cy="9" r="7"/>
      <path d="M20 23V9.5a3 3 0 0 1 6 0V20l8.4 1.7a4.6 4.6 0 0 1 3.6 5.3l-1.3 8a6.5 6.5 0 0 1-6.4 5.5h-8.4a6.5 6.5 0 0 1-5-2.4L10.6 31a3 3 0 0 1 4.4-4.1L20 31z"/></svg>
    <p data-t="swipe"></p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="data.js?v=27"></script>
  <script src="js/i18n.js?v=24"></script>
  <script src="js/sound.js"></script>
  <script src="js/app.js?v=25"></script>
</body>
</html>
